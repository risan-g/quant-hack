# Curated portfolio with light regime filters.
#
# These filters are deliberately conservative:
# - momentum/breakout legs prefer expanding volatility and tolerable spreads
# - mean-reversion legs avoid strong trend/volatility expansion
legs:
  - symbol: XAUUSD
    strategy: momentum_8
    weight: 0.30
    regime:
      require_expanding_vol: true
      min_vol_ratio: 0.85
      min_trend_strength: 4.0
      max_spread_z: 3.0
  - symbol: USDJPY
    strategy: mean_reversion_8
    weight: 0.25
    regime:
      avoid_expanding_vol: true
      max_vol_ratio: 1.45
      max_trend_strength: 9.0
      max_spread_z: 3.0
  - symbol: USDCHF
    strategy: momentum_32
    weight: 0.15
    regime:
      require_expanding_vol: true
      min_vol_ratio: 0.90
      min_trend_strength: 3.0
      max_spread_z: 3.0
  - symbol: AUDUSD
    strategy: breakout_32
    weight: 0.15
    regime:
      require_expanding_vol: true
      min_vol_ratio: 0.85
      min_trend_strength: 2.5
      max_spread_z: 3.0
  - symbol: USDCAD
    strategy: momentum_32
    weight: 0.15
    regime:
      require_expanding_vol: true
      min_vol_ratio: 0.90
      min_trend_strength: 3.0
      max_spread_z: 3.0

risk:
  base_gross_leverage: 7.0
  attack_gross_leverage: 10.0
  defend_gross_leverage: 1.0
  max_gross_leverage: 12.0
  soft_drawdown: 0.10
  hard_drawdown: 0.14
  attack_drawdown: 0.02
  recent_loss_window: 16
  recent_loss_cut: -0.015
  recovery_bars: 8
