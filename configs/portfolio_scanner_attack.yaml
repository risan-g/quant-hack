# Aggressive v4 elimination-sprint scanner.
#
# Goal: maximize leaderboard recovery before cutoff while keeping explicit
# equity bounds, lot caps, no-one-step-flip behavior, and risk projection guards.
legs:
  - symbol: USDJPY
    strategy: mean_reversion_16
    weight: 0.30
    max_lots: 10.0
    regime:
      max_spread_z: 1.25
      min_abs_reversion_z: 1.20
      min_vol_ratio: 0.40
      m15_ema_fast: 12
      m15_ema_slow: 48
  - symbol: EURUSD
    strategy: mean_reversion_32
    weight: 0.25
    max_lots: 10.0
    regime:
      max_spread_z: 1.20
      min_abs_reversion_z: 1.20
      min_vol_ratio: 0.40
      m15_ema_fast: 12
      m15_ema_slow: 48
  - symbol: GBPUSD
    strategy: m15_momentum_32
    weight: 0.25
    max_lots: 10.0
    regime:
      max_spread_z: 1.25
      min_abs_move_strength: 1.50
      min_vol_ratio: 0.45
      require_m15_trend_align: true
      m15_ema_fast: 12
      m15_ema_slow: 48
  - symbol: USDCHF
    strategy: m15_momentum_32
    weight: 0.10
    max_lots: 10.0
    regime:
      max_spread_z: 1.25
      min_abs_move_strength: 1.50
      min_vol_ratio: 0.45
      require_m15_trend_align: true
      m15_ema_fast: 12
      m15_ema_slow: 48
  - symbol: XAUUSD
    strategy: m15_momentum_32
    weight: 0.10
    max_lots: 1.00
