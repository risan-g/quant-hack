# Adaptive version of the first evidence-based portfolio.
#
# Leg weights define unit exposure. The risk governor chooses total gross leverage
# through time based on equity drawdown and recent realized losses.
legs:
  - symbol: XAUUSD
    strategy: momentum_8
    weight: 0.30
  - symbol: USDJPY
    strategy: mean_reversion_8
    weight: 0.25
  - symbol: USDCHF
    strategy: momentum_32
    weight: 0.15
  - symbol: AUDUSD
    strategy: breakout_32
    weight: 0.15
  - symbol: USDCAD
    strategy: momentum_32
    weight: 0.15

risk:
  base_gross_leverage: 20.0
  attack_gross_leverage: 27.5
  defend_gross_leverage: 2.0
  max_gross_leverage: 27.5
  soft_drawdown: 0.20
  hard_drawdown: 0.35
  attack_drawdown: 0.05
  recent_loss_window: 16
  recent_loss_cut: -0.035
  recovery_bars: 8
